name: Deploy sito (FTP)

# PUBBLICAZIONE MANUALE — il tuo "1-click".
# Dopo aver revisionato l'articolo committato dal bot, avvia questo workflow
# da GitHub → Actions → "Deploy sito (FTP)" → "Run workflow".
# Usa FTP-Deploy-Action: niente listing ricorsivo (usa un file di stato sul
# server) → veloce e senza stalli tipici dell'FTP da CI.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-sito
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm ci

      - name: Build del sito
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 60000
